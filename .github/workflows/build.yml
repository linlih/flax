# 打 Mac 安装包。在 Actions 页点 "Run workflow" 得到一份构建产物（保留 14 天）；
# 推一个 v0.1.1 这样的标签（apps/desktop/scripts/release.sh）就发布一个版本：
# dmg、zip 和 latest-mac.yml 传到 Releases，装好的 Flax 从这里检查更新。
name: Build app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: macOS
    # 系统翻译小助手要 Xcode 26（macOS 26 的 Translation 框架）
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Flax 自己的签名证书（apps/desktop/scripts/macos-signing.sh）。每个版本同一张证书，
      # macOS 才认得是同一个应用，自动更新才装得上。没有这个 secret 就用临时签名。
      - name: macOS signing certificate
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MAC_CERTIFICATE" ]; then
            echo "::warning::没有 MAC_CERTIFICATE secret，这个版本用临时签名，装好的 Flax 不能自动更新到它。"
            exit 0
          fi
          kc="$RUNNER_TEMP/flax-signing.keychain-db"
          kp="$(openssl rand -hex 16)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          echo "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/flax.p12"
          security import "$RUNNER_TEMP/flax.p12" -k "$kc" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm "$RUNNER_TEMP/flax.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$kc"
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: flax-mac
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml
      # 标签的说明就是发布说明，也是应用里更新提示显示的内容
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Flax $GITHUB_REF_NAME" --notes-from-tag --verify-tag
          cd apps/desktop/dist
          gh release upload "$GITHUB_REF_NAME" *.dmg *.zip *.blockmap latest-mac.yml --clobber
