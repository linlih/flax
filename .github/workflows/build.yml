# 打 Mac、Windows 安装包，安卓 APK 和 iOS IPA。在 Actions 页点 "Run workflow" 得到一份构建产物（保留 14 天）；
# 推一个 v0.1.1 这样的标签（apps/desktop/scripts/release.sh）就发布一个版本：都打好后，
# dmg、zip、latest-mac.yml、exe、latest.yml、apk 和 ipa 一起传到 Releases，装好的 Flax（电脑和手机）从这里检查更新。
name: Build app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: macOS
    # 系统翻译小助手要 Xcode 26（macOS 26 的 Translation 框架）
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # 测试和打包都不用 node_modules 里的 Electron 程序，省一次下载（打包用 .electron-dist 里的 zip）
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run typecheck
      - run: npm test
      # Flax 自己的签名证书（apps/desktop/scripts/macos-signing.sh）。每个版本同一张证书，
      # macOS 才认得是同一个应用，自动更新才装得上。没有这个 secret 就用临时签名。
      - name: macOS signing certificate
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MAC_CERTIFICATE" ]; then
            echo "::warning::没有 MAC_CERTIFICATE secret，这个版本用临时签名，装好的 Flax 不能自动更新到它。"
            exit 0
          fi
          kc="$RUNNER_TEMP/flax-signing.keychain-db"
          kp="$(openssl rand -hex 16)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          echo "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/flax.p12"
          security import "$RUNNER_TEMP/flax.p12" -k "$kc" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm "$RUNNER_TEMP/flax.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$kc"
      # Electron 的 zip（scripts/fetch-electron.mjs 下载、核对校验和）和 electron-builder 自己的工具。
      # GitHub 的下载时不时 504，缓存住以后大多数构建一个都不用下。
      # 缓存按 Electron 和 electron-builder 的版本分（发版只改应用版本号，缓存不变）。
      # 标签上的构建只能读到 main 上存的缓存，由 electron-cache.yml 在 main 上填好。
      - id: ver
        shell: bash
        run: echo "v=$(node -p "const l=require('./package-lock.json').packages; l['node_modules/electron'].version+'-'+l['node_modules/electron-builder'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          key: electron-mac-${{ steps.ver.outputs.v }}
          path: |
            apps/desktop/.electron-dist
            ~/Library/Caches/electron-builder
      # 打包过程中 electron-builder 还会下自己的工具，偶尔失败就再来一次
      - name: Package
        run: for i in 1 2 3; do npm run dist && exit 0; echo "::warning::打包失败（第 $i 次），30 秒后重试"; sleep 30; done; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: flax-mac
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # 测试和打包都不用 node_modules 里的 Electron 程序，省一次下载（打包用 .electron-dist 里的 zip）
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run typecheck
      - run: npm test
      # 没有代码签名证书：第一次运行时 SmartScreen 会提示，点"更多信息 › 仍要运行"
      # 缓存按 Electron 和 electron-builder 的版本分（发版只改应用版本号，缓存不变）。
      # 标签上的构建只能读到 main 上存的缓存，由 electron-cache.yml 在 main 上填好。
      - id: ver
        shell: bash
        run: echo "v=$(node -p "const l=require('./package-lock.json').packages; l['node_modules/electron'].version+'-'+l['node_modules/electron-builder'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          key: electron-win-${{ steps.ver.outputs.v }}
          path: |
            apps/desktop/.electron-dist
            ~\AppData\Local\electron-builder\Cache
      - name: Package
        shell: bash
        run: for i in 1 2 3; do npm run dist:win -w @flax/desktop && exit 0; echo "::warning::打包失败（第 $i 次），30 秒后重试"; sleep 30; done; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: flax-windows
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 发版时 app.json 的版本号要和标签一致（release.sh 会改好），不然手机上的检查更新会一直提示有新版
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./apps/mobile/app.json').expo.version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::apps/mobile/app.json 的版本是 $v，标签是 $GITHUB_REF_NAME。用 npm run release 发版，它会一起改。"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run typecheck -w @flax/mobile
      # 发布用的签名（apps/mobile/plugins/withReleaseSigning.js）。每个版本同一把密钥，
      # 手机上才能装在旧版本之上。没有这个 secret 就用 debug 签名，打出来的包只能试，不发布。
      - name: Android signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            [ "${GITHUB_REF_NAME#v}" = "$GITHUB_REF_NAME" ] || { echo "::error::没有 ANDROID_KEYSTORE secret，不能发布安卓版。"; exit 1; }
            echo "::warning::没有 ANDROID_KEYSTORE secret，这次用 debug 签名。"
            exit 0
          fi
          mkdir -p apps/mobile/signing
          echo "$ANDROID_KEYSTORE" | base64 --decode > apps/mobile/signing/flax-release.keystore
          printf 'storeFile=flax-release.keystore\nstorePassword=%s\nkeyAlias=flax\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > apps/mobile/signing/release.properties
      - name: Prebuild
        working-directory: apps/mobile
        run: npm run prebuild -- --no-install
      # 只打 64 位 ARM：近几年的安卓手机都是，包小一半
      - name: Package
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Name the APK
        run: |
          v=$(node -p "require('./apps/mobile/app.json').expo.version")
          mkdir -p dist
          mv apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/Flax-$v-android.apk"
          rm -rf apps/mobile/signing
      - uses: actions/upload-artifact@v4
        with:
          name: flax-android
          retention-days: 14
          if-no-files-found: error
          path: dist/*.apk

  # iOS：没有 Apple 开发者账号，打不签名的 .ipa。用户用 AltStore 或 Sideloadly 拿自己的 Apple ID 签好再装
  # （免费 Apple ID 签的 7 天过期，AltStore 会自动续）。
  ios:
    name: iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./apps/mobile/app.json').expo.version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::apps/mobile/app.json 的版本是 $v，标签是 $GITHUB_REF_NAME。用 npm run release 发版，它会一起改。"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run typecheck -w @flax/mobile
      - name: Prebuild
        working-directory: apps/mobile
        run: npm run prebuild:ios -- --no-install
      - name: Pods
        working-directory: apps/mobile/ios
        env:
          LANG: en_US.UTF-8
        run: pod install
      - name: Package
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Flax.xcworkspace -scheme Flax -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -50
      - name: Make the IPA
        run: |
          v=$(node -p "require('./apps/mobile/app.json').expo.version")
          mkdir -p dist ipa/Payload
          cp -R apps/mobile/ios/build/Build/Products/Release-iphoneos/Flax.app ipa/Payload/
          (cd ipa && zip -qry "../dist/Flax-$v-ios.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: flax-ios
          retention-days: 14
          if-no-files-found: error
          path: dist/*.ipa

  # 都打好才发布，免得只有一部分
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # 标签的说明就是发布说明，也是应用里更新提示显示的内容
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Flax $GITHUB_REF_NAME" --notes-from-tag --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
