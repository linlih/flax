# 打 Mac 和 Windows 安装包。在 Actions 页点 "Run workflow" 得到一份构建产物（保留 14 天）；
# 推一个 v0.1.1 这样的标签（apps/desktop/scripts/release.sh）就发布一个版本：两边都打好后，
# dmg、zip、latest-mac.yml 和 exe、latest.yml 一起传到 Releases，装好的 Flax 从这里检查更新。
name: Build app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: macOS
    # 系统翻译小助手要 Xcode 26（macOS 26 的 Translation 框架）
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # 测试和打包都不用 node_modules 里的 Electron 程序，省一次下载（打包用 .electron-dist 里的 zip）
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run typecheck
      - run: npm test
      # Flax 自己的签名证书（apps/desktop/scripts/macos-signing.sh）。每个版本同一张证书，
      # macOS 才认得是同一个应用，自动更新才装得上。没有这个 secret 就用临时签名。
      - name: macOS signing certificate
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MAC_CERTIFICATE" ]; then
            echo "::warning::没有 MAC_CERTIFICATE secret，这个版本用临时签名，装好的 Flax 不能自动更新到它。"
            exit 0
          fi
          kc="$RUNNER_TEMP/flax-signing.keychain-db"
          kp="$(openssl rand -hex 16)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          echo "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/flax.p12"
          security import "$RUNNER_TEMP/flax.p12" -k "$kc" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm "$RUNNER_TEMP/flax.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$kc"
      # Electron 的 zip（scripts/fetch-electron.mjs 下载、核对校验和）和 electron-builder 自己的工具。
      # GitHub 的下载时不时 504，缓存住以后大多数构建一个都不用下。
      - uses: actions/cache@v4
        with:
          key: electron-mac-${{ hashFiles('node_modules/electron/package.json', 'node_modules/electron-builder/package.json') }}
          restore-keys: electron-mac-
          path: |
            apps/desktop/.electron-dist
            ~/Library/Caches/electron-builder
      # 打包过程中 electron-builder 还会下自己的工具，偶尔失败就再来一次
      - name: Package
        run: for i in 1 2 3; do npm run dist && exit 0; echo "::warning::打包失败（第 $i 次），30 秒后重试"; sleep 30; done; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: flax-mac
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # 测试和打包都不用 node_modules 里的 Electron 程序，省一次下载（打包用 .electron-dist 里的 zip）
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run typecheck
      - run: npm test
      # 没有代码签名证书：第一次运行时 SmartScreen 会提示，点"更多信息 › 仍要运行"
      - uses: actions/cache@v4
        with:
          key: electron-win-${{ hashFiles('node_modules/electron/package.json', 'node_modules/electron-builder/package.json') }}
          restore-keys: electron-win-
          path: |
            apps/desktop/.electron-dist
            ~\AppData\Local\electron-builder\Cache
      - name: Package
        shell: bash
        run: for i in 1 2 3; do npm run dist:win -w @paper/desktop && exit 0; echo "::warning::打包失败（第 $i 次），30 秒后重试"; sleep 30; done; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: flax-windows
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml

  # 两边都打好才发布，免得只有一半
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # 标签的说明就是发布说明，也是应用里更新提示显示的内容
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Flax $GITHUB_REF_NAME" --notes-from-tag --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
