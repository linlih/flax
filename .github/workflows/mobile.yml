# 安卓 APK 和 iOS IPA。build.yml（发版、手动构建）和 mobile-cache.yml（在 main 上填编译缓存）都调用它。
#
# 编译缓存：两边最慢的都是从头编译原生代码（Reanimated、Worklets、Screens、SVG 这些的 C++ / Objective-C++），
# 每次发版都一样。ccache 把编译结果存下来，下次同样的文件直接拿结果；安卓另外用 Gradle 的构建缓存。
# GitHub Actions 的缓存按分支 / 标签隔开，标签上的构建只读得到 main 上存的，
# 所以由 mobile-cache.yml 在 main 上每周跑一次、存缓存（fill-cache），发版的构建只读不存。
# Swift 代码 ccache 管不到，iOS 省多少要看实际跑出来的命中率（Package 后面的 ccache 统计）。
# 填缓存的那次还会留下 ccache 的调试记录（每个文件算哈希用了哪些东西），命中率低时下载两次的记录比一比就知道是什么在变。
name: Mobile

on:
  workflow_call:
    inputs:
      fill-cache:
        description: 存编译缓存（只在 main 上有用），不上传安装包
        type: boolean
        default: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
  CCACHE_MAXSIZE: 1500M
  # 每次都是同一个检出路径，路径换成相对的以后命中率更稳
  CCACHE_BASEDIR: ${{ github.workspace }}
  # 按编译器文件的内容认编译器，不看修改时间：GitHub 换了一版机器镜像，同一个编译器的修改时间也会变
  CCACHE_COMPILERCHECK: content

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 发版时 app.json 的版本号要和标签一致（release.sh 会改好），不然手机上的检查更新会一直提示有新版
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./apps/mobile/app.json').expo.version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::apps/mobile/app.json 的版本是 $v，标签是 $GITHUB_REF_NAME。用 npm run release 发版，它会一起改。"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Gradle 的缓存（含 --build-cache 的结果）在 main 上存、在标签上只读，setup-gradle 默认就是这样
      - uses: gradle/actions/setup-gradle@v4
      - name: ccache
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-
      - run: npm ci
      - run: npm run typecheck -w @flax/mobile
      # 发布用的签名（apps/mobile/plugins/withReleaseSigning.js）。每个版本同一把密钥，
      # 手机上才能装在旧版本之上。没有这个 secret 就用 debug 签名，打出来的包只能试，不发布。
      - name: Android signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            [ "${GITHUB_REF_NAME#v}" = "$GITHUB_REF_NAME" ] || { echo "::error::没有 ANDROID_KEYSTORE secret，不能发布安卓版。"; exit 1; }
            echo "::warning::没有 ANDROID_KEYSTORE secret，这次用 debug 签名。"
            exit 0
          fi
          mkdir -p apps/mobile/signing
          echo "$ANDROID_KEYSTORE" | base64 --decode > apps/mobile/signing/flax-release.keystore
          printf 'storeFile=flax-release.keystore\nstorePassword=%s\nkeyAlias=flax\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > apps/mobile/signing/release.properties
      - name: Prebuild
        working-directory: apps/mobile
        run: npm run prebuild -- --no-install
      # 只打 64 位 ARM：近几年的安卓手机都是，包小一半。
      # CMake 从这两个环境变量拿编译器前缀，原生库的 C/C++ 都经过 ccache
      - name: Package
        working-directory: apps/mobile/android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # 第一次跑出来 578 次编译 0 次命中（2026-11-22）。工作目录不进哈希（调试信息里的路径每次都一样）；
          # 生成的头文件每次都是新写的，不看文件的修改时间
          CCACHE_NOHASHDIR: "true"
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,file_stat_matches,system_headers
          CCACHE_DEBUG: ${{ inputs.fill-cache && 'true' || '' }}
          CCACHE_DEBUGDIR: ${{ runner.temp }}/ccache-debug
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --build-cache --no-daemon
      - name: ccache stats
        if: always()
        run: ccache -s
      - if: inputs.fill-cache
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-android-${{ github.sha }}-${{ github.run_id }}
      - name: Keep ccache debug records
        if: always() && inputs.fill-cache
        uses: actions/upload-artifact@v4
        with:
          name: ccache-debug-android
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/ccache-debug/**/*.ccache-input-text
      - name: Name the APK
        if: ${{ !inputs.fill-cache }}
        run: |
          v=$(node -p "require('./apps/mobile/app.json').expo.version")
          mkdir -p dist
          mv apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/Flax-$v-android.apk"
      - name: Remove signing key
        if: always()
        run: rm -rf apps/mobile/signing
      - if: ${{ !inputs.fill-cache }}
        uses: actions/upload-artifact@v4
        with:
          name: flax-android
          retention-days: 14
          if-no-files-found: error
          path: dist/*.apk

  # iOS：没有 Apple 开发者账号，打不签名的 .ipa。用户用 AltStore 或 Sideloadly 拿自己的 Apple ID 签好再装
  # （免费 Apple ID 签的 7 天过期，AltStore 会自动续）。
  ios:
    name: iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./apps/mobile/app.json').expo.version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::apps/mobile/app.json 的版本是 $v，标签是 $GITHUB_REF_NAME。用 npm run release 发版，它会一起改。"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          command -v ccache >/dev/null || brew install ccache
      # 用 ccache 在 Mac 上的默认目录：Xcode 调编译器时不一定带上这里的环境变量，
      # 上次设了 CCACHE_DIR，结果缓存写到了默认目录，存缓存的那一步什么也没找到（2026-11-22）
      - uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ github.sha }}
          restore-keys: ccache-ios-
      - run: npm ci
      - run: npm run typecheck -w @flax/mobile
      - name: Prebuild
        working-directory: apps/mobile
        run: npm run prebuild:ios -- --no-install
      # USE_CCACHE=1：Expo 生成的 Podfile 让 React Native 把编译器换成它的 ccache 包装脚本
      - name: Pods
        working-directory: apps/mobile/ios
        env:
          LANG: en_US.UTF-8
          USE_CCACHE: 1
        run: pod install
      - name: Package
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Flax.xcworkspace -scheme Flax -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -50
      - name: ccache stats
        if: always()
        run: |
          ccache -s
          du -sh ~/Library/Caches/ccache ~/.ccache 2>/dev/null || true
      - if: inputs.fill-cache
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ github.sha }}-${{ github.run_id }}
      - name: Make the IPA
        if: ${{ !inputs.fill-cache }}
        run: |
          v=$(node -p "require('./apps/mobile/app.json').expo.version")
          mkdir -p dist ipa/Payload
          cp -R apps/mobile/ios/build/Build/Products/Release-iphoneos/Flax.app ipa/Payload/
          (cd ipa && zip -qry "../dist/Flax-$v-ios.ipa" Payload)
      - if: ${{ !inputs.fill-cache }}
        uses: actions/upload-artifact@v4
        with:
          name: flax-ios
          retention-days: 14
          if-no-files-found: error
          path: dist/*.ipa
